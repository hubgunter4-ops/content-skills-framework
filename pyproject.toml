[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "content-skills-toolkit"
version = "0.1.0"
description = "Colección modular de habilidades de contenido y documentación"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["toolkit*"]
