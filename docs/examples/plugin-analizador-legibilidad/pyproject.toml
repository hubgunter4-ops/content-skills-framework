[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "content-skills-plugin-legibilidad"
version = "1.0.0"
description = "Plugin de ejemplo para Content Skills Toolkit"
requires-python = ">=3.10"
dependencies = [
  "content-skills-toolkit>=0.3,<0.4",
]

[project.entry-points."content_skills_toolkit.tools"]
community-analizador-de-legibilidad = "plugin:create_tool"

[tool.setuptools]
py-modules = ["plugin"]
include-package-data = true
